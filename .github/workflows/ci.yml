name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://referee:referee@localhost:5432/referee_hub
      DIRECT_URL: postgresql://referee:referee@localhost:5432/referee_hub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  e2e:
    name: Playwright (API y UI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: referee
          POSTGRES_PASSWORD: referee
          POSTGRES_DB: referee_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U referee -d referee_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://referee:referee@localhost:5432/referee_hub
      DIRECT_URL: postgresql://referee:referee@localhost:5432/referee_hub
      CORS_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SEED_PASSWORD: ci-only-seed-password
      BASE_URL: http://localhost:5173
      API_URL: http://localhost:3000
      START_SERVERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm --filter @referee-hub/tests exec playwright install --with-deps chromium
      - run: pnpm test:staging
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
